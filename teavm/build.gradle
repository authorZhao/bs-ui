plugins {
  id 'java'
}

sourceSets.main.resources.srcDirs += [ rootProject.file('assets').path ]
project.ext.mainClassName = "com.git.teavm.TeaVMBuilder"
eclipse.project.name = appName + "-teavm"

// This must be at least 11, and no higher than the JDK version this project is built with.
java.targetCompatibility = "25"
// This should probably be equal to targetCompatibility, above. This only affects the TeaVM module.
java.sourceCompatibility = "25"


dependencies {
  implementation "com.badlogicgames.gdx:gdx-box2d-gwt:$gdxVersion"
  implementation("com.github.xpenatan.gdx-teavm:backend-web:$gdxTeaVMVersion"){
    exclude group: 'org.slf4j', module: 'slf4j-api'
  }
  implementation "com.github.xpenatan.gdx-teavm:gdx-freetype-teavm:$gdxTeaVMVersion"
//  implementation "org.teavm:teavm-classlib:$teaVMVersion"
//  implementation "org.teavm:teavm-core:$teaVMVersion"
//  implementation "org.teavm:teavm-jso-apis:$teaVMVersion"
//  implementation "org.teavm:teavm-jso-impl:$teaVMVersion"
//  implementation "org.teavm:teavm-jso:$teaVMVersion"
//  implementation "org.teavm:teavm-tooling:$teaVMVersion"
  implementation(project(':demo')) {
    // TeaVM 目标里官方 slf4j-api 的 LoggerFactory.<clinit> 会因调用
    // SecurityManager.getClassContext / ClassLoader.getResources /
    // LinkedBlockingQueue 等 JVM 原生 API 而崩。
    // 本模块自带最小 org.slf4j 替换（src/main/java/org/slf4j/**），
    // 故从传递依赖里剔除官方 slf4j-api，避免类路径冲突。
    exclude group: 'org.slf4j', module: 'slf4j-api'
  }

}

tasks.register("runRelease", JavaExec) {
  description = "Run the TeaVM application hosted via a local Jetty server at http://localhost:8080/"
  group("application")
  dependsOn(classes)
  mainClass.set(project.mainClassName)
  setClasspath(sourceSets.main.runtimeClasspath)
  args += ["run"]
}

tasks.register("runDebug", JavaExec) {
  description = "Run the TeaVM application with debug enabled hosted via a local Jetty server at http://localhost:8080/"
  group("application")
  dependsOn(classes)
  mainClass.set(project.mainClassName)
  setClasspath(sourceSets.main.runtimeClasspath)
  args += ["debug", "run"]
}

tasks.register("buildRelease", JavaExec) {
  description = "Build the TeaVM application; doesn't run directly"
  group("build")
  dependsOn(classes)
  mainClass.set(project.mainClassName)
  setClasspath(sourceSets.main.runtimeClasspath)
}

tasks.register("buildDebug", JavaExec) {
  description = "Build the TeaVM application with debug enabled; doesn't run directly"
  group("build")
  dependsOn(classes)
  mainClass.set(project.mainClassName)
  setClasspath(sourceSets.main.runtimeClasspath)
  args += ["debug"]
}

// For backwards compatibility with the earlier run and build tasks.
tasks.register("run"){
  dependsOn runRelease
}
build.dependsOn buildRelease
