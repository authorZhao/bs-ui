plugins {
  id 'java'
}

sourceSets.main.resources.srcDirs += [ rootProject.file('assets').path ]
project.ext.mainClassName = "com.git.teavm.TeaVMBuilder"
eclipse.project.name = appName + "-teavm"

// This must be at least 11, and no higher than the JDK version this project is built with.
java.targetCompatibility = "25"
// This should probably be equal to targetCompatibility, above. This only affects the TeaVM module.
java.sourceCompatibility = "25"


dependencies {
  implementation "com.badlogicgames.gdx:gdx-box2d-gwt:$gdxVersion"
  implementation("com.github.xpenatan.gdx-teavm:backend-web:$gdxTeaVMVersion"){
    exclude group: 'org.slf4j', module: 'slf4j-api'
  }
  implementation "com.github.xpenatan.gdx-teavm:gdx-freetype-teavm:$gdxTeaVMVersion"
//  implementation "org.teavm:teavm-classlib:$teaVMVersion"
//  implementation "org.teavm:teavm-core:$teaVMVersion"
//  implementation "org.teavm:teavm-jso-apis:$teaVMVersion"
//  implementation "org.teavm:teavm-jso-impl:$teaVMVersion"
//  implementation "org.teavm:teavm-jso:$teaVMVersion"
//  implementation "org.teavm:teavm-tooling:$teaVMVersion"
  implementation(project(':demo')) {
    // TeaVM 目标里官方 slf4j-api 的 LoggerFactory.<clinit> 会因调用
    // SecurityManager.getClassContext / ClassLoader.getResources /
    // LinkedBlockingQueue 等 JVM 原生 API 而崩。
    // 本模块自带最小 org.slf4j 替换（src/main/java/org/slf4j/**），
    // 故从传递依赖里剔除官方 slf4j-api，避免类路径冲突。
    exclude group: 'org.slf4j', module: 'slf4j-api'
  }

}

tasks.register("runRelease", JavaExec) {
  description = "Run the TeaVM application hosted via a local Jetty server at http://localhost:8080/"
  group("application")
  dependsOn(classes)
  mainClass.set(project.mainClassName)
  setClasspath(sourceSets.main.runtimeClasspath)
  args += ["run"]
}

tasks.register("runDebug", JavaExec) {
  description = "Run the TeaVM application with debug enabled hosted via a local Jetty server at http://localhost:8080/"
  group("application")
  dependsOn(classes)
  mainClass.set(project.mainClassName)
  setClasspath(sourceSets.main.runtimeClasspath)
  args += ["debug", "run"]
}

tasks.register("buildRelease", JavaExec) {
  description = "Build the TeaVM application; doesn't run directly"
  group("build")
  dependsOn(classes)
  mainClass.set(project.mainClassName)
  setClasspath(sourceSets.main.runtimeClasspath)
}

tasks.register("buildDebug", JavaExec) {
  description = "Build the TeaVM application with debug enabled; doesn't run directly"
  group("build")
  dependsOn(classes)
  mainClass.set(project.mainClassName)
  setClasspath(sourceSets.main.runtimeClasspath)
  args += ["debug"]
}

// For backwards compatibility with the earlier run and build tasks.
tasks.register("run"){
  dependsOn runRelease
}
build.dependsOn buildRelease

// ---- releasePak：发布线上版（资源打进 assets.pak，单文件 HTTP + 后续加密）----
// 原 buildRelease/runRelease/runDebug 不动——开发走散列资源（改了即生效、免打包）。
// releasePak 才打包：packResources 产出 assets.pak，TeaVMBuilder 以 "pak" 参数只列 assets.pak。
// packResources 产出 assets.pak；releasePak 把它的绝对路径通过 -Dbs.pak.file 传给 TeaVMBuilder，
// TeaVMBuilder 用 new AssetFileHandle(绝对路径)（FileType.Absolute，disk 方式）让 gdx-teavm 直接读文件拷进 dist。
// （Classpath 方式 gdx-teavm 没识别到 assets.pak，故改用绝对路径。）
def pakDir = file("${buildDir}/pak")
def pakFile = file("${pakDir}/assets.pak")
tasks.register("packResources", JavaExec) {
  group = 'build'
  description = '打包 skin/emoji/icons/core-i18n/demo-i18n 为 assets.pak（web：core i18n 也进 pak）'
  dependsOn ':bs-res:classes'
  classpath = project(':bs-res').sourceSets.main.runtimeClasspath
  mainClass = 'com.git.bs.res.PakPacker'
  args = [pakFile.absolutePath,
          project(':assets-skin').file('src/main/resources/com/git/bs/ui/skin').absolutePath, 'com/git/bs/ui/skin',
          project(':assets-emoji').file('src/main/resources/com/git/bs/ui/emoji').absolutePath, 'com/git/bs/ui/emoji',
          project(':assets-icons').file('src/main/resources/com/git/bs/ui/icons').absolutePath, 'com/git/bs/ui/icons',
          project(':core').file('src/main/resources/com/git/bs/i18n').absolutePath, 'com/git/bs/i18n',
          project(':demo').file('src/main/resources/com/git/bs/demo/i18n').absolutePath, 'com/git/bs/demo/i18n']
  inputs.dir project(':assets-skin').file('src/main/resources/com/git/bs/ui/skin')
  inputs.dir project(':assets-emoji').file('src/main/resources/com/git/bs/ui/emoji')
  inputs.dir project(':assets-icons').file('src/main/resources/com/git/bs/ui/icons')
  inputs.dir project(':core').file('src/main/resources/com/git/bs/i18n')
  inputs.dir project(':demo').file('src/main/resources/com/git/bs/demo/i18n')
  outputs.file pakFile
  doFirst { pakFile.getParentFile().mkdirs() }
}
tasks.register("releasePak", JavaExec) {
  description = "Build the TeaVM application with assets.pak（发布线上：资源打进 pak；后续加密）；doesn't run directly"
  group("build")
  dependsOn(classes)
  dependsOn(packResources)
  mainClass.set(project.mainClassName)
  setClasspath(sourceSets.main.runtimeClasspath)
  args += ["pak"]
  doLast {
    // 不靠 gdx-teavm 的 addAssets（copyDirectory 对单文件直接跳过）——直接把 assets.pak 拷进成品
    // assets 目录 build/dist/webapp/assets/，并在 preload 清单补一行（同目录的 preload.txt），
    // 让 gdx-teavm 启动时预加载它，PakBootstrap 才能经 internal("assets.pak") 读到。
    def distAssets = file("${buildDir}/dist/webapp/assets")
    def pakTarget = new File(distAssets, "assets.pak")
    pakTarget.bytes = pakFile.bytes
    def preload = new File(distAssets, "preload.txt")
    preload.append("i:b:/assets.pak:${pakTarget.length()}:1${System.lineSeparator()}")

  }
}

// ---- app.wasm 加密（-PwasmCrypt=true，默认关）----
// 独立 JavaExec 任务（releasePak 后 finalizedBy 触发）：加密 app.wasm + 拷 loader.js + 注入 index.html。
// （Gradle 9 移除了 doLast 里的 javaexec/exec，故用独立任务跑 WasmEncrypter。）
// ⚠️ loader.js 的浏览器运行时解密【需实测】；构建期加密已 WasmEncrypterTest 验证。
tasks.register('encryptWasm', JavaExec) {
  group = 'build'
  description = "加密 app.wasm + 注入 loader.js（releasePak -PwasmCrypt 后自动跑）"
  dependsOn ':bs-res:classes'
  // WasmEncrypter 在 :bs-res 模块（2026-07-24 从 :core 拆出），classpath 必须指向 :bs-res
  classpath = project(':bs-res').sourceSets.main.runtimeClasspath
  mainClass = 'com.git.bs.res.WasmEncrypter'
  args = [file("${buildDir}/dist/webapp/app.wasm").absolutePath]
  doLast {
    def webapp = file("${buildDir}/dist/webapp")
    new File(webapp, 'loader.js').bytes = file('web/loader.js').bytes
    def idx = new File(webapp, 'index.html')
    if (idx.exists() && !idx.text.contains('loader.js')) {
      idx.text = idx.text.replaceFirst('(?=<script)',
              '<script src="loader.js"></script>' + System.lineSeparator())
    }
    println('[wasmCrypt] app.wasm 已加密 + loader.js 已注入 index.html（需浏览器实测）')
  }
}
if (project.hasProperty('wasmCrypt')) {
  tasks.named('releasePak') { finalizedBy 'encryptWasm' }
}
