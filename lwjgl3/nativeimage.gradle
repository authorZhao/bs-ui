String scanAsserts(String projectDir){
  def assetsFolder = new File("${project.rootDir}/assets/assets.txt")
  var list = assetsFolder.readLines()

  var buffer = new StringBuffer()

  buffer.append("""
  {
    "resources" : {
      "includes" : [
""")

  int i = 0;
  for (final def str in list) {
    if(i < list.size() - 1) {
      buffer.append("""{"glob": "$str"},
""")
    } else {
      buffer.append("""{"glob": "$str"}""")
    }
    i++
  }

buffer.append("""
        ]
      },
      "bundles" : [ ]
    }
  """)
  var string = buffer.toString()

  println("str=\r\n$string")
  return string

}
