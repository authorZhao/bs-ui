buildscript {
  repositories {
    gradlePluginPortal()
  }
}

plugins {
  id "io.github.fourlastor.construo" version "1.4.1"
  id 'application'
}

sourceSets.main.resources.srcDirs += [ rootProject.file('assets').path ]

def mainClassName = project.findProperty('mainClass')?.toString() ?: 'com.git.bs.test.BsControlsLauncher'
application.setMainClass(mainClassName)
eclipse.project.name = appName + '-lwjgl3'
java.sourceCompatibility = JavaVersion.VERSION_25
java.targetCompatibility = JavaVersion.VERSION_25
if (JavaVersion.current().isJava9Compatible()) {
  compileJava.options.release.set(25)
}

dependencies {
  implementation project(':core')
  implementation project(':common')
  implementation project(':demo')

  implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-tools:$gdxVersion"
  implementation "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
  implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"

  // Bootstrap Icons SVG → PNG+atlas 转换工具（Batik）：iconpkg 用
  // exclude xpp3 + pull-parser：它们注册的 SAXParserFactory 不识别 external-general-entities
  // feature，会让 Batik 在 JDK 21 上抛 SAXNotRecognizedException
  implementation("org.apache.xmlgraphics:batik-all:$xmlGraphicsBatik") {
    exclude group: 'xpp3', module: 'xpp3'
    exclude group: 'pull-parser', module: 'pull-parser'
  }
  implementation "org.apache.xmlgraphics:xmlgraphics-commons:$xmlGraphicsCommons"
  implementation "org.slf4j:slf4j-api:$slf4jVersion"
  compileOnly "org.projectlombok:lombok:$lombokVersion"
  annotationProcessor "org.projectlombok:lombok:$lombokVersion"
  implementation "com.alibaba.fastjson2:fastjson2:$fastjson2Version"

  testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'

  testImplementation project(':bs-res')
}

test {
  useJUnitPlatform()
}

def os = System.properties['os.name'].toLowerCase()

tasks.withType(JavaCompile).configureEach {
  options.compilerArgs += ['--add-modules', 'java.desktop']
}

run {
  workingDir = rootProject.file('assets').path
  setIgnoreExitValue(true)

  // 把 bs.* 系统属性转发到 run 的 JVM（如 -Dbs.pak.spike=true）
  System.getProperties().each { k, v ->
    if (k.toString().startsWith('bs.')) systemProperty k.toString(), v
  }

  if (os.contains('mac')) jvmArgs += "-XstartOnFirstThread"
}

// 打包 skin/emoji/icons/demo-i18n 为 assets.pak（明文条目，P2；P3 才加密/压缩）。
// 放消费模块而非 core：避免 core 的 processResources↔packResources↔classes 循环依赖。
def pakDir = file('build/pak')
def pakFile = file("${pakDir}/assets.pak")
def skinDir = project(':assets-skin').file('src/main/resources/com/git/bs/ui/skin')
def emojiDir = project(':assets-emoji').file('src/main/resources/com/git/bs/ui/emoji')
def iconsDir = project(':assets-icons').file('src/main/resources/com/git/bs/ui/icons')
def demoI18nDir = project(':demo').file('src/main/resources/com/git/bs/demo/i18n')
tasks.register('packResources', JavaExec) {
  group = 'build'
  description = '打包 skin/emoji/icons/demo-i18n 为 assets.pak'
  dependsOn ':bs-res:classes'
  classpath = project(':bs-res').sourceSets.main.runtimeClasspath
  mainClass = 'com.git.bs.res.PakPacker'
  args = [pakFile.absolutePath,
          skinDir.absolutePath, 'com/git/bs/ui/skin',
          emojiDir.absolutePath, 'com/git/bs/ui/emoji',
          iconsDir.absolutePath, 'com/git/bs/ui/icons',
          demoI18nDir.absolutePath, 'com/git/bs/demo/i18n']
  inputs.dir skinDir
  inputs.dir emojiDir
  inputs.dir iconsDir
  inputs.dir demoI18nDir
  outputs.file pakFile
  doFirst { pakDir.mkdirs() }
}
sourceSets.main.resources.srcDir(pakDir)
processResources.dependsOn('packResources')

// 可执行 jar（WinSettingsLauncher）：代码 + core i18n + assets.pak 全部入 jar；
// 明文 skin/emoji/icons/demo-i18n 排除（已在 pak 里，不能以明文留在 jar）。
// 运行：java -Dbs.pak.spike=exit -jar build/dist-winsettings/*.jar
def winDistDir = file("${buildDir}/dist-winsettings")
tasks.register('distWinSettings', Jar) {
  group = 'distribution'
  description = '可执行 jar（WinSettingsLauncher）：代码+core i18n+assets.pak 入 jar，明文素材排除'
  dependsOn classes, configurations.runtimeClasspath
  archiveFileName.set("${appName}-winsettings-${projectVersion}.jar")
  destinationDirectory.set(winDistDir)
  duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
  from sourceSets.main.output
  from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
  exclude('com/git/bs/ui/skin/**', 'com/git/bs/ui/emoji/**', 'com/git/bs/ui/icons/**',
          'com/git/bs/demo/i18n/**')
  exclude('META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/maven/**')
  manifest { attributes 'Main-Class': 'com.git.bs.test.WinSettingsLauncher' }
}

// distBsSkin：BsSkinLauncher 的加密 pak 可执行 jar（同 distWinSettings，只换 Main-Class / 输出目录）。
// 运行：java -Dbs.exit=true -jar build/dist-bsskin/*.jar（bs.exit 仅无界面验证用；正式跑 java -jar）
tasks.register('distBsSkin', Jar) {
  group = 'distribution'
  description = '可执行 jar（BsSkinLauncher）：代码+core i18n+assets.pak 入 jar，明文素材排除'
  dependsOn classes, configurations.runtimeClasspath
  archiveFileName.set("${appName}-bsskin-${projectVersion}.jar")
  destinationDirectory.set(file("${buildDir}/dist-bsskin"))
  duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
  from sourceSets.main.output
  from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
  exclude('com/git/bs/ui/skin/**', 'com/git/bs/ui/emoji/**', 'com/git/bs/ui/icons/**',
          'com/git/bs/demo/i18n/**')
  exclude('META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/maven/**')
  manifest { attributes 'Main-Class': 'com.git.bs.test.BsSkinLauncher' }
}

// ---- 平台裁剪 dist（仿 jarWin/jarMac，只留单平台 native）----
// -Pplatform=win|linux|mac；不传则按当前编译机 OS 自适应
def distTargetPlatform
if (project.hasProperty('platform')) {
    distTargetPlatform = project.property('platform').toString().toLowerCase()
} else {
    String osName = System.getProperty('os.name', '').toLowerCase()
    distTargetPlatform = osName.contains('win') ? 'win'
            : osName.contains('mac') ? 'mac'
            : (osName.contains('nix') || osName.contains('nux') || osName.contains('aix')) ? 'linux'
            : 'win'
}
def nativeExcludeByPlatform = [
        win:   ['macos/**', 'linux/**', '**/*.so', '**/*.dylib'],
        linux: ['windows/**', 'macos/**', '**/*.dll', '**/*.dylib'],
        mac:   ['windows/**', 'linux/**', '**/*.dll', '**/*.so']
]
def distPlatformExcludes = nativeExcludeByPlatform[distTargetPlatform]
if (distPlatformExcludes == null) {
    throw new GradleException("未知平台 '${distTargetPlatform}'，支持 win / linux / mac（-Pplatform=...）")
}
tasks.register('distWinSettingsPlatform', Jar) {
  group = 'distribution'
  description = "可执行 jar（WinSettingsLauncher，平台裁剪 ${distTargetPlatform}）：只含本平台 native + 加密 pak"
  dependsOn classes, configurations.runtimeClasspath
  archiveFileName.set("${appName}-winsettings-${projectVersion}-${distTargetPlatform}.jar")
  destinationDirectory.set(file("${buildDir}/dist-winsettings-${distTargetPlatform}"))
  duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
  from sourceSets.main.output
  from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
  exclude('com/git/bs/ui/skin/**', 'com/git/bs/ui/emoji/**', 'com/git/bs/ui/icons/**', 'com/git/bs/demo/i18n/**')
  distPlatformExcludes.each { exclude it }
  exclude('META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/maven/**')
  manifest { attributes 'Main-Class': 'com.git.bs.test.WinSettingsLauncher' }
}
tasks.register('distBsSkinPlatform', Jar) {
  group = 'distribution'
  description = "可执行 jar（BsSkinLauncher，平台裁剪 ${distTargetPlatform}）：只含本平台 native + 加密 pak"
  dependsOn classes, configurations.runtimeClasspath
  archiveFileName.set("${appName}-bsskin-${projectVersion}-${distTargetPlatform}.jar")
  destinationDirectory.set(file("${buildDir}/dist-bsskin-${distTargetPlatform}"))
  duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
  from sourceSets.main.output
  from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
  exclude('com/git/bs/ui/skin/**', 'com/git/bs/ui/emoji/**', 'com/git/bs/ui/icons/**', 'com/git/bs/demo/i18n/**')
  distPlatformExcludes.each { exclude it }
  exclude('META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/maven/**')
  manifest { attributes 'Main-Class': 'com.git.bs.test.BsSkinLauncher' }
}

jar {
  archiveFileName.set("${appName}-${projectVersion}.jar")
  duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
  dependsOn configurations.runtimeClasspath
  from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
  exclude('META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  dependencies {
    exclude('META-INF/INDEX.LIST', 'META-INF/maven/**')
  }
  manifest {
    attributes 'Main-Class': mainClassName
  }
  doLast {
    file(archiveFile).setExecutable(true, false)
  }
}

// Builds a JAR that only includes the files needed to run on macOS, not Windows or Linux.
// The file size for a Mac-only JAR is about 7MB smaller than a cross-platform JAR.
tasks.register("jarMac") {
  dependsOn("jar")
  group("build")
  jar.archiveFileName.set("${appName}-${projectVersion}-mac.jar")
  jar.exclude("windows/x86/**", "windows/x64/**", "linux/arm32/**", "linux/arm64/**", "linux/x64/**", "**/*.dll", "**/*.so",
          'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  dependencies {
    jar.exclude("windows/x86/**", "windows/x64/**", "linux/arm32/**", "linux/arm64/**", "linux/x64/**",
            'META-INF/INDEX.LIST', 'META-INF/maven/**')
  }
}

// Builds a JAR that only includes the files needed to run on Linux, not Windows or macOS.
// The file size for a Linux-only JAR is about 5MB smaller than a cross-platform JAR.
tasks.register("jarLinux") {
  dependsOn("jar")
  group("build")
  jar.archiveFileName.set("${appName}-${projectVersion}-linux.jar")
  jar.exclude("windows/x86/**", "windows/x64/**", "macos/arm64/**", "macos/x64/**", "**/*.dll", "**/*.dylib",
          'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  dependencies {
    jar.exclude("windows/x86/**", "windows/x64/**", "macos/arm64/**", "macos/x64/**",
            'META-INF/INDEX.LIST', 'META-INF/maven/**')
  }
}

// Builds a JAR that only includes the files needed to run on Windows, not Linux or macOS.
// The file size for a Windows-only JAR is about 6MB smaller than a cross-platform JAR.
tasks.register("jarWin") {
  dependsOn("jar")
  group("build")
  jar.archiveFileName.set("${appName}-${projectVersion}-win.jar")
  jar.exclude("macos/arm64/**", "macos/x64/**", "linux/arm32/**", "linux/arm64/**", "linux/x64/**", "**/*.dylib", "**/*.so",
          'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
  dependencies {
    jar.exclude("macos/arm64/**", "macos/x64/**", "linux/arm32/**", "linux/arm64/**", "linux/x64/**",
            'META-INF/INDEX.LIST', 'META-INF/maven/**')
  }
}

construo {
  // name of the executable
  name.set(appName)
  // human-readable name, used for example in the `.app` name for macOS
  humanName.set(appName)
  // Optional, defaults to project version property
  version.set("$projectVersion")

  targets.configure {
    create("linuxX64", io.github.fourlastor.construo.Target.Linux) {
      architecture.set(io.github.fourlastor.construo.Target.Architecture.X86_64)
      jdkUrl.set("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.12%2B7/OpenJDK17U-jdk_x64_linux_hotspot_17.0.12_7.tar.gz")
    }
    create("macM1", io.github.fourlastor.construo.Target.MacOs) {
      architecture.set(io.github.fourlastor.construo.Target.Architecture.AARCH64)
      jdkUrl.set("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.12%2B7/OpenJDK17U-jdk_aarch64_mac_hotspot_17.0.12_7.tar.gz")
      // macOS needs an identifier
      identifier.set("com.git.bs.test." + appName)
      // Optional: icon for macOS
      macIcon.set(project.file("icons/logo.icns"))
    }
    create("macX64", io.github.fourlastor.construo.Target.MacOs) {
      architecture.set(io.github.fourlastor.construo.Target.Architecture.X86_64)
      jdkUrl.set("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.12%2B7/OpenJDK17U-jdk_x64_mac_hotspot_17.0.12_7.tar.gz")
      // macOS needs an identifier
      identifier.set("com.git.bs.test." + appName)
      // Optional: icon for macOS
      macIcon.set(project.file("icons/logo.icns"))
    }
    create("winX64", io.github.fourlastor.construo.Target.Windows) {
      architecture.set(io.github.fourlastor.construo.Target.Architecture.X86_64)
      jdkUrl.set("https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.12%2B7/OpenJDK17U-jdk_x64_windows_hotspot_17.0.12_7.zip")
    }
  }
}

// Equivalent to the jar task; here for compatibility with gdx-setup.
tasks.register('dist') {
  dependsOn 'jar'
}
