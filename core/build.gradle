plugins {
  id 'java-library'
  id 'maven-publish'
}

group = 'com.git.bs'

eclipse.project.name = appName + '-core'

dependencies {
  api project(':common')
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"   // BsSkinLoader 用 FreeTypeFontGenerator
  implementation "org.slf4j:slf4j-api:$slf4jVersion"

  compileOnly "org.projectlombok:lombok:$lombokVersion"
  annotationProcessor "org.projectlombok:lombok:$lombokVersion"
}

// 发布配置（发布到 mavenLocal；远程仓库见 gradle/publish.gradle 的注释段）
ext.publishArtifactId  = 'bs-ui-core'
ext.publishDescription = 'bs-ui: Bootstrap-style UI components for libGDX (core library)'
apply from: "$rootDir/gradle/publish.gradle"

// 注意：packResources（产出 assets.pak）不放 core，而放消费模块（lwjgl3/teavm）。
// 原因：pak 要进 classpath（被 processResources 消费），打包器又要 core 的 classes，
// 放 core 会形成 processResources ↔ packResources ↔ classes 循环依赖。
