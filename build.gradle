buildscript {
  repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://s01.oss.sonatype.org' }
    gradlePluginPortal()
    google()
    maven {url 'https://maven.aliyun.com/repository/central'}
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://teavm.org/maven/repository/' }
  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir file('build/classes/java/main')
      testOutputDir file('build/classes/java/test')
    }
  }
}

// bs-ui 子项目通用配置：移除 generateAssetList（assets 由用户自行管理）
configure(subprojects) {
  apply plugin: 'java-library'

  // 字节码基线分两档：跨平台库 common / core / bs-res（core 对外 api 暴露 common，安卓 D8 只吃到 Java 17）→ release 17；
  // 其余模块（demo / lwjgl3 / teavm）→ 25。用 release 而不是 source/target：连 API 也卡住，不会误用更高版本的新方法
  def releaseFor = name in ['common', 'core', 'bs-res'] ? 17 : 25
  tasks.withType(JavaCompile).configureEach {
    options.incremental = true
    options.release = releaseFor
  }
}

subprojects {
  version = projectVersion
  ext.appName = 'bs-ui'
  repositories {
    mavenCentral()
    maven { url 'https://s01.oss.sonatype.org' }
    mavenLocal()
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://jitpack.io' }
  }

  test {
    //onlyIf { false } // 默认不执行测试
  }
}

eclipse.project.name = 'bs-ui' + '-parent'

// ============================================================================
// Maven 发布：core / common 等需要被外部引用的 library 模块在自己的 build.gradle
// 里加一行 `apply from: "$rootDir/gradle/publish.gradle"`，并在 plugins{} 块声明
// `id 'maven-publish'` 即可（详见 gradle/publish.gradle 顶部注释）。
// ============================================================================
