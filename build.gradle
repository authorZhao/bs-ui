buildscript {
  repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'https://s01.oss.sonatype.org' }
    gradlePluginPortal()
    google()
    maven {url 'https://maven.aliyun.com/repository/central'}
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://teavm.org/maven/repository/' }
  }
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'

  // This allows you to "Build and run using IntelliJ IDEA", an option in IDEA's Settings.
  idea {
    module {
      outputDir file('build/classes/java/main')
      testOutputDir file('build/classes/java/test')
    }
  }
}

// bs-ui 子项目通用配置：移除 generateAssetList（assets 由用户自行管理）
configure(subprojects) {
  apply plugin: 'java-library'

  compileJava {
    options.incremental = true
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
  }
}

subprojects {
  version = projectVersion
  ext.appName = 'bs-ui'
  repositories {
    mavenCentral()
    maven { url 'https://s01.oss.sonatype.org' }
    mavenLocal()
    maven { url 'https://oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    maven { url 'https://jitpack.io' }
  }

  test {
    //onlyIf { false } // 默认不执行测试
  }
}

eclipse.project.name = 'bs-ui' + '-parent'

// ============================================================================
// Maven 发布：core / common 等需要被外部引用的 library 模块在自己的 build.gradle
// 里加一行 `apply from: "$rootDir/gradle/publish.gradle"`，并在 plugins{} 块声明
// `id 'maven-publish'` 即可（详见 gradle/publish.gradle 顶部注释）。
// ============================================================================
