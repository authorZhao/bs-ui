plugins {
  id 'java-library'
  id 'maven-publish'
}

group = 'com.git.bs'

eclipse.project.name = appName + '-assets-emoji'

// 纯资源模块：彩色 emoji + 头像图集，classpath 路径 com/git/bs/ui/emoji/**。
ext.publishArtifactId  = 'bs-assets-emoji'
ext.publishDescription = 'bs-ui: emoji + head avatar atlases'
apply from: "$rootDir/gradle/publish.gradle"
