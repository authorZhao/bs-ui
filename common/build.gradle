plugins {
  id 'java-library'
  id 'maven-publish'
}

group = 'cn.pingyuanren'

eclipse.project.name = appName + '-common'

dependencies {

  implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
  implementation "org.slf4j:slf4j-api:$slf4jVersion"
  implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"

  compileOnly "org.projectlombok:lombok:$lombokVersion"
  annotationProcessor "org.projectlombok:lombok:$lombokVersion"
}

// 发布配置（发布到 mavenLocal；远程仓库见 gradle/publish.gradle 的注释段）
ext.publishArtifactId  = 'bs-ui-common'
ext.publishDescription = 'bs-ui: platform-agnostic interfaces (Platform, file-chooser signatures)'
apply from: "$rootDir/gradle/publish.gradle"
