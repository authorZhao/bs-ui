// ============================================================================
// bs-ui library 模块公共 Maven 发布配置
//
// 用法（在 core / common 等子模块的 build.gradle 里）：
//
//   plugins {
//     id 'java-library'
//     id 'maven-publish'          // ← 必须在 plugins{} 块声明，不能 apply
//   }
//
//   ext.publishArtifactId    = 'bs-ui-core'
//   ext.publishDescription   = 'bs-ui core library'
//   apply from: "$rootDir/gradle/publish.gradle"
//
// 坐标：group = 项目 group（cn.pingyuanren），version = 项目 version（0.3.0）
// 产物：主 jar + sources jar + javadoc jar
// 仓库：mavenLocal（默认启用）；远程仓库见下方注释段
// ============================================================================

// javadoc 容错：项目里部分历史 javadoc 注释有 @link 引用缺失 / HTML 字符问题，
// 不阻塞发布。javadocJar 仍会生成（内容可能不完整，但 jar 结构合法，满足 Maven Central 要求）。
javadoc {
    options {
        encoding = 'UTF-8'
        charSet = 'UTF-8'
        // 关闭超严检查：忽略 @link 引用不到、HTML 不规整等问题
        addStringOption('Xdoclint:none', '-quiet')
    }
    failOnError = false
}

// sources jar（Maven Central 强制要求；本地用也有助于 IDE 调试跳转）
tasks.register('sourcesJar', Jar) {
    from sourceSets.main.allSource
    archiveClassifier.set('sources')
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
}

// javadoc jar（Maven Central 强制要求）
tasks.register('javadocJar', Jar) {
    dependsOn javadoc
    from javadoc.destinationDir
    archiveClassifier.set('javadoc')
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact sourcesJar
            artifact javadocJar
            artifactId = project.ext.has('publishArtifactId')
                    ? project.ext.publishArtifactId : project.name

            pom {
                name = project.ext.has('publishArtifactId')
                        ? project.ext.publishArtifactId : project.name
                description = project.ext.has('publishDescription')
                        ? project.ext.publishDescription : 'bs-ui library'
                url = 'https://github.com/authorZhao/bs-ui'

                licenses {
                    license {
                        name = 'Mozilla Public License 2.0'
                        url = 'https://mozilla.org/MPL/2.0/'
                    }
                }

                developers {
                    developer {
                        id = 'bs-ui'
                        name = 'bs-ui contributors'
                    }
                }

                scm {
                    connection = 'scm:git:git://github.com/authorZhao/bs-ui.git'
                    developerConnection = 'scm:git:ssh://github.com/authorZhao/bs-ui.git'
                    url = 'https://github.com/authorZhao/bs-ui'
                }
            }
        }
    }

    repositories {
        // 本地：发布到 ~/.m2/repository
        // 其他项目可直接 implementation 'cn.pingyuanren:bs-ui-core:0.3.0' 引用
        mavenLocal()

        // ============================================================
        // 远程仓库（暂未启用）
        // 配置好 url + credentials 后取消注释即可。credentials 推荐用
        // gradle.properties（bsUiRepoUser / bsUiRepoPass）或环境变量，避免硬编码。
        // ============================================================
        // maven {
        //   name = 'releases'
        //   url = 'https://your-nexus-or-maven-host/repository/maven-releases/'
        //   credentials {
        //     username = findProperty('bsUiRepoUser') ?: System.getenv('BS_UI_REPO_USER')
        //     password = findProperty('bsUiRepoPass') ?: System.getenv('BS_UI_REPO_PASS')
        //   }
        // }
        // maven {
        //   name = 'snapshots'
        //   url = 'https://your-nexus-or-maven-host/repository/maven-snapshots/'
        //   credentials {
        //     username = findProperty('bsUiRepoUser') ?: System.getenv('BS_UI_REPO_USER')
        //     password = findProperty('bsUiRepoPass') ?: System.getenv('BS_UI_REPO_PASS')
        //   }
        // }
    }
}

// ============================================================================
// Maven Central 发布（默认【关】）：gradle <task> -PcentralRelease=true 启用
// 前置（详见 docs/publish-maven-central.md）：
//   - ~/.gradle/gradle.properties 配 centralUser / centralToken / signingKey / signingPassword
//   - group 必须是 Central 可验证 namespace（cn.pingyuanren，经 pingyuanren.cn DNS TXT 验证，见文档 §0）
// ============================================================================
if (project.hasProperty('centralRelease')) {
    apply plugin: 'signing'
    signing {
        useInMemoryPgpKeys(
                findProperty('signingKey') as String,
                findProperty('signingPassword') as String)
        sign publishing.publications.mavenJava
    }
    publishing {
        repositories {
            maven {
                name = 'centralPortal'
                // 发布端点（以 central.sonatype.org 官方文档为准）：
                //   release  → OSSRH Staging API（Central Portal 对 Gradle maven-publish 的
                //              官方兼容端点；maven-central/ 是只读下载仓库，PUT 会 404）
                //   snapshot → Central Portal snapshot 仓库（可直接 PUT）
                url = version.toString().endsWith('SNAPSHOT')
                        ? uri('https://central.sonatype.com/repository/maven-snapshots/')
                        : uri('https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/')
                credentials {
                    username = findProperty('centralUser') as String
                    password = findProperty('centralToken') as String
                }
            }
        }
    }
}
